<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Event Ticket Form">
        <meta name="author" content="Ryan Lee">
        <title>Event Ticket</title>
        <link rel="stylesheet" 
              href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" 
              integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w==" 
              crossorigin="anonymous" 
              referrerpolicy="no-referrer">
        <link rel="icon" href="favicon.ico">
        <link rel="stylesheet" href="styles.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        
        <main>
            <h1>Event Ticket</h1>
            <form id="eventForm">
                <div class="field">
                    <label for="firstName">First Name</label>
                    <input id="firstName" name="firstName" type="text" required>
                </div>

                <div class="field">
                    <label for="lastName">Last Name</label>
                    <input id="lastName" name="lastName" type="text" required>
                </div>

                <div class="field full">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" required />
                </div>

                <div class="field">
                    <label for="userType">Type</label>
                    <select
                        id="userType"
                        name="userType"
                        aria-controls="idContainer codeContainer"
                        required
                    >
                        <option value="">Choose one</option>
                        <option value="student">Student</option>
                        <option value="guest">Guest</option>
                    </select>
                </div>

                <div class="field">
                    <label for="eventDate">Event Date</label>
                    <input id="eventDate" name="eventDate" type="date" required />
                </div>

                <div id="idContainer" class="field full" hidden>
                    <label for="studentId">Student I#</label>
                    <input id="studentId" name="studentId" type="text" inputmode="numeric">
                </div>

                <div id="codeContainer" class="field full" hidden>
                    <label for="code">Access Code</label>
                    <input id="code" name="code" type="text">
                </div>

                <button class="full" type="submit">Create Ticket</button>
            </form>

            <section id="output" aria-live="polite"></section>
        </main>
        
    </body>
</html>
